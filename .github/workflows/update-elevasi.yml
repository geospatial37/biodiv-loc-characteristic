name: Update elevasi camera trap

on:
  workflow_dispatch:        # tombol "Run workflow" di tab Actions
  # Hapus tanda # pada dua baris di bawah untuk menjalankan otomatis tiap hari 01:17 WIB (18:17 UTC).
  # schedule:
  #   - cron: '17 18 * * *'

permissions:
  contents: write           # diperlukan untuk meng-commit output/elevasi.csv

concurrency:
  group: update-elevasi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Hitung elevasi, lereng, dan tinggi kanopi
        run: python update_elevasi.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_GID: '2116481874'            # angka setelah "gid=" pada URL sheet "type"
          DEM_FILES: Assets/DEM_*.tif        # file DEM di repo
          # Tinggi kanopi Meta/WRI CHMv2 (~1,2 m), dibaca langsung dari AWS tanpa diunduh utuh.
          # Dua tile ini mencakup seluruh area DEM. Untuk memakai file di repo, ganti dengan: Assets/CHM_*.tif
          KANOPI_FILES: >-
            https://dataforgood-fb-data.s3.amazonaws.com/forests/v2/global/dinov3_global_chm_v2_ml3/chm/1322333203.tif,
            https://dataforgood-fb-data.s3.amazonaws.com/forests/v2/global/dinov3_global_chm_v2_ml3/chm/1322333221.tif
          RADIUS_BUFFER_M: '50'              # radius buffer untuk rata-rata lereng dan kanopi
          DEM_NOL_KOSONG: 'true'             # piksel DEM bernilai 0 dianggap kosong (di luar area proyek)
          OUTPUT_CSV: output/elevasi.csv
          FALLBACK_COPERNICUS: 'false'       # 'true' = elevasi titik di luar DEM diisi Copernicus GLO-90

      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/elevasi.csv
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Perbarui karakteristik lokasi camera trap"
            git push
          fi
